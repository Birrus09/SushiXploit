<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SushiXploit Order App</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1>Sushi Restaurant Order App</h1>
    <div id="table-info" class="table-info">Checking authorization...</div>
    <div id="content" style="display:none;">
      <div class="sushi-grid" id="sushi-grid"></div>
      <div class="order-section">
        <label for="order-notes">Special Instructions (Optional)</label>
        <textarea id="order-notes" placeholder="Add any special requests..."></textarea>
      </div>
      <button class="order-btn" id="send-btn" style="width: 100%;">Send Order</button>
      <div id="message"></div>
    </div>
  </div>

  <script>
    let currentTableId = null;
    const quantities = {
      salmon: 0,
      tuna: 0,
      avocado: 0,
      california: 0
    };
    
    const sushiData = [
      { key: 'salmon', name: 'Salmon Sushi', img: '/pics/nigiri_salmon.jpg' },
      { key: 'tuna', name: 'Tuna Sushi', img: '/pics/hosomaki_tuna.jpg' },
      { key: 'avocado', name: 'Avocado Sushi', img: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzMzMyIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QXZvY2FkbzwvdGV4dD48L3N2Zz4=' },
      { key: 'california', name: 'California Sushi', img: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzMzMyIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Q2FsaWZvcm5pYTwvdGV4dD48L3N2Zz4=' }
    ];

    function init() {
      const grid = document.getElementById('sushi-grid');
      sushiData.forEach(s => {
        const div = document.createElement('div');
        div.className = 'sushi-item';
        div.innerHTML = `
          <img src="${s.img}" alt="${s.name}">
          <h3>${s.name}</h3>
          <div class="quantity-controls">
            <button onclick="changeQuantity('${s.key}', -1)">-</button>
            <span id="${s.key}-qty">0</span>
            <button onclick="changeQuantity('${s.key}', 1)">+</button>
          </div>
        `;
        grid.appendChild(div);
      });

      fetch('/auth_status').then(r => r.json()).then(status => {
        if (!status.authorized) {
          window.location.href = '/';
          return;
        }
        currentTableId = status.tableId;
        document.getElementById('table-info').textContent = 'Table: ' + status.tableId;
        document.getElementById('content').style.display = 'block';
      }).catch(() => {
        document.getElementById('table-info').textContent = 'Unable to load auth status.';
      });

      document.getElementById('send-btn').onclick = sendOrder;
    }

    function changeQuantity(type, delta) {
      quantities[type] = Math.max(0, quantities[type] + delta);
      document.getElementById(type + '-qty').textContent = quantities[type];
    }

    async function sendOrder() {
      const items = Object.entries(quantities).filter(([_, count]) => count > 0);
      if (items.length === 0) {
        alert('Please select at least one item');
        return;
      }

      const btn = document.getElementById('send-btn');
      const notes = document.getElementById('order-notes').value.trim();
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('/auth_status');
        const status = await res.json();
        if (!status.authorized) {
          window.location.href = '/';
          return;
        }

        const responses = await Promise.all(items.map(([type, count]) =>
          fetch('/order/' + status.tableId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: type + ' sushi',
              count: count,
              notes: notes || undefined
            })
          })
        ));

        const msg = document.getElementById('message');
        if (responses.every(r => r.ok)) {
          msg.className = 'success';
          msg.textContent = 'Order sent!';
          Object.keys(quantities).forEach(k => quantities[k] = 0);
          document.querySelectorAll('[id$="-qty"]').forEach(el => el.textContent = '0');
          document.getElementById('order-notes').value = '';
          setTimeout(() => { msg.textContent = ''; msg.className = ''; }, 3000);
        } else {
          msg.className = 'error';
          msg.textContent = 'Order failed';
        }
      } catch (e) {
        const msg = document.getElementById('message');
        msg.className = 'error';
        msg.textContent = 'Order failed: Network error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Order';
      }
    }

    init();
  </script>
</body>
</html>
