<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SushiXploit Order App</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1>Sushi Restaurant Order App</h1>
    <div id="table-info" class="table-info">Checking authorization...</div>
    <div id="content" style="display:none;">
      <div class="sushi-grid">
        <div class="sushi-item">
          <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzMzMyIgdGV4dC1hbmNob3I9Im1pZGRsZSI+U2FsbW9uPC90ZXh0Pjwvc3ZnPg==" alt="Salmon Sushi">
          <h3>Salmon Sushi</h3>
          <div class="quantity-controls">
            <button onclick="changeQuantity('salmon', -1)">-</button>
            <span id="salmon-qty">1</span>
            <button onclick="changeQuantity('salmon', 1)">+</button>
          </div>
          <button class="order-btn" onclick="placeOrder('salmon', event)">Order Salmon Sushi</button>
        </div>

        <div class="sushi-item">
          <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzMzMyIgdGV4dC1hbmNob3I9Im1pZGRsZSI+VHVuYTwvdGV4dD48L3N2Zz4=" alt="Tuna Sushi">
          <h3>Tuna Sushi</h3>
          <div class="quantity-controls">
            <button onclick="changeQuantity('tuna', -1)">-</button>
            <span id="tuna-qty">1</span>
            <button onclick="changeQuantity('tuna', 1)">+</button>
          </div>
          <button class="order-btn" onclick="placeOrder('tuna', event)">Order Tuna Sushi</button>
        </div>

        <div class="sushi-item">
          <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzMzMyIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QXZvY2FkbzwvdGV4dD48L3N2Zz4=" alt="Avocado Sushi">
          <h3>Avocado Sushi</h3>
          <div class="quantity-controls">
            <button onclick="changeQuantity('avocado', -1)">-</button>
            <span id="avocado-qty">1</span>
            <button onclick="changeQuantity('avocado', 1)">+</button>
          </div>
          <button class="order-btn" onclick="placeOrder('avocado', event)">Order Avocado Sushi</button>
        </div>

        <div class="sushi-item">
          <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzMzMyIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Q2FsaWZvcm5pYTwvdGV4dD48L3N2Zz4=" alt="California Sushi">
          <h3>California Sushi</h3>
          <div class="quantity-controls">
            <button onclick="changeQuantity('california', -1)">-</button>
            <span id="california-qty">1</span>
            <button onclick="changeQuantity('california', 1)">+</button>
          </div>
          <button class="order-btn" onclick="placeOrder('california', event)">Order California Sushi</button>
        </div>
      </div>
      <div id="message"></div>
    </div>
  </div>

  <script>
    const quantities = {
      salmon: 1,
      tuna: 1,
      avocado: 1,
      california: 1
    };

    function changeQuantity(type, delta) {
      quantities[type] = Math.max(1, quantities[type] + delta);
      document.getElementById(type + '-qty').textContent = quantities[type];
    }

    async function placeOrder(type, event) {
      const count = quantities[type];
      const btn = event.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Ordering...';

      try {
        const statusResponse = await fetch('/auth_status');
        const status = await statusResponse.json();
        if (!status.authorized) {
          window.location.href = '/';
          return;
        }

        const response = await fetch('/order/' + status.tableId, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ count, type: type + ' sushi' })
        });

        const result = await response.json();
        const messageDiv = document.getElementById('message');

        if (response.ok) {
          messageDiv.className = 'success';
          messageDiv.textContent = 'Order successful: ' + result.message;
        } else {
          messageDiv.className = 'error';
          messageDiv.textContent = 'Order failed: ' + (result.error || 'Unknown error');
        }
      } catch (error) {
        const messageDiv = document.getElementById('message');
        messageDiv.className = 'error';
        messageDiv.textContent = 'Order failed: Network error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Order ' + type.charAt(0).toUpperCase() + type.slice(1) + ' Sushi';
      }
    }

    async function init() {
      try {
        const response = await fetch('/auth_status');
        const status = await response.json();

        if (!status.authorized) {
          window.location.href = '/';
          return;
        }

        document.getElementById('table-info').textContent = 'Table: ' + status.tableId;
        document.getElementById('content').style.display = 'block';
      } catch (error) {
        document.getElementById('table-info').textContent = 'Unable to load auth status.';
      }
    }

    init();
  </script>
</body>
</html>
